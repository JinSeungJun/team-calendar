name: PC 위젯 빌드

# widget 폴더가 바뀌어서 main에 올라오면 자동 빌드 → Releases에 exe 업로드
on:
  push:
    branches: [main]
    paths: ['widget/**', '.github/workflows/widget.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: widget
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 버전 읽기
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 팀 캘린더 PC 위젯 v${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            아래 Assets에서 **TeamCalendarWidget_v${{ steps.ver.outputs.version }}.exe** 를 받아 실행하세요. (설치 없이 바로 실행)
            처음 실행 시 "Windows의 PC 보호" 창이 뜨면 → 추가 정보 → 실행
          files: widget/dist/*.exe
